[package]
name = "gitr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"
gix = { version = "0.88", default-features = false, features = ["sha1"] }
# Diff syntax colours: syntect with bat's grammars (two-face), pure-Rust regexes (no Oniguruma).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects, so Stop ends everything git started (runner.rs). Same version as src-tauri's.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { workspace = true, features = ["test-util"] }
