# cargo-audit configuration (audit.yml runs `cargo audit --deny warnings` from the repo root).
# Every entry needs an upstream release to clear. Re-check on each Tauri, syntect or
# github-copilot-sdk upgrade and drop entries that no longer fire.

[advisories]
ignore = [
    # zip <9: ZipArchive::extract can follow symlinks, mis-handle Unix modes, keep SUID bits
    # (0367-0369) and abort on a symlink entry with a huge declared size (0429). The app itself
    # no longer has zip: tauri-plugin-updater is built without its "zip" feature (Gitr's updates
    # are a signed NSIS .exe). What is left is github-copilot-sdk's build-dependency on zip 7: its
    # build script reads its own CLI download entry by entry (by_index) and never calls extract,
    # and it does not ship in Gitr. Drop these once github-copilot-sdk depends on zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # Unmaintained or unsound warnings, not vulnerabilities.
    "RUSTSEC-2025-0141", # bincode 1.3: unmaintained, pulled in by syntect

    # zbus 5 helper crates: unmaintained, pulled in by Tauri's Linux D-Bus support.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive

    # Tauri's GTK 0.18 stack (Linux only; not in the Windows build).
    "RUSTSEC-2024-0370", # proc-macro-error 1.0.4: unmaintained
    "RUSTSEC-2024-0429", # glib 0.18.5: unsound VariantStrIter iterator impls
]
