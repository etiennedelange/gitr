[workspace]
resolver = "3"
members = ["crates/gitr-core", "crates/gitr-remote", "crates/gitr-ai", "src-tauri"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gitr-core = { path = "crates/gitr-core" }
gitr-remote = { path = "crates/gitr-remote" }
gitr-ai = { path = "crates/gitr-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tempfile = "3"
