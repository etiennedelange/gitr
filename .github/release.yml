# Groups the "What's changed" list that GitHub generates for each release (one line per
# squash-merged PR, titled by the PR title). Label PRs to sort them; unlabelled ones land in Other.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New
      labels: [feature, enhancement]
    - title: Fixed
      labels: [bug, fix]
    - title: Dependencies
      # Dependabot adds this label itself.
      labels: [dependencies]
    - title: Other
      labels: ['*']
