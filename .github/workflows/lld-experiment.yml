name: lld experiment

# Temporary: times the Windows test build with the default linker against rust-lld on one runner.
on:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: mkdir -p ui/dist
      - name: Warm up (default linker)
        run: cargo test --workspace --locked --no-run -q
      - name: Time rebuilds after touching gitr-core
        run: |
          build() {
            touch crates/gitr-core/src/lib.rs
            local s=$(date +%s%N)
            if [ "$1" = lld ]; then
              CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe cargo test --workspace --locked --no-run -q
            else
              cargo test --workspace --locked --no-run -q
            fi
            echo "$1: $(( ($(date +%s%N)-s)/1000000 )) ms" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          # lld first once untimed: switching linker may relink everything the first time.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe cargo test --workspace --locked --no-run -q
          for i in 1 2 3; do build default; build lld; done
      - name: Tests pass when linked with rust-lld
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
        run: cargo test --workspace --locked --no-fail-fast
