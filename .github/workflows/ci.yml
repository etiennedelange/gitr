name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    # Usually about a minute; a hung step otherwise runs for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its parents, for the check below (see the rust job).
          fetch-depth: 2
          persist-credentials: false
      # Markdown-only and release PRs: nothing to check here either (the UI formatter ignores *.md).
      - name: Anything to test?
        id: scope
        if: github.event_name == 'pull_request'
        run: echo "skip=$(node tools/release/release.mjs skip-ci HEAD^1 HEAD)" >> "$GITHUB_OUTPUT"
      # Same version as devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.skip != 'true'
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.skip != 'true'
      # Format, lint and typecheck.
      - run: pnpm --filter ui exec vp check
        if: steps.scope.outputs.skip != 'true'
      - run: pnpm --filter ui build
        if: steps.scope.outputs.skip != 'true'
      - run: pnpm --filter ui test
        if: steps.scope.outputs.skip != 'true'
      # Release and packaging scripts (tools/**/*.test.mjs).
      - run: pnpm test:tools
        if: steps.scope.outputs.skip != 'true'
      # THIRD_PARTY_NOTICES.txt ships in the installer; the release no longer checks it, CI does.
      - run: pnpm notices:check
        if: steps.scope.outputs.skip != 'true'

  rust:
    # Windows is the target platform; Linux matches the dev container; macOS keeps the non-Windows paths honest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # About 5 minutes; the slowest of recent runs took 15.
    timeout-minutes: 45
    env:
      # No debug info: faster compiling and linking, and a smaller cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit; with its parents, HEAD^1 is main and HEAD^1..HEAD
          # is exactly the PR's change.
          fetch-depth: 2
          persist-credentials: false

      # Nothing to test in a PR that only changes Markdown (docs, CHANGELOG) or is a release PR
      # (`pnpm release`: the version bump; the code passed CI when it merged). The job still runs
      # and passes, so the required checks report, but its steps are skipped.
      - name: Anything to test?
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          skip=$(node tools/release/release.mjs skip-ci HEAD^1 HEAD)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = true ] && echo "::notice::Only Markdown files or the release version changed; skipping the Rust build and tests."
          true

      # Tauri's build-time deps (linked by tao/wry/webkit2gtk); same list as .devcontainer/post-create.sh.
      - name: Install system packages
        if: runner.os == 'Linux' && steps.scope.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.skip != 'true'
      # PRs restore main's cache but don't save their own, so they can't push main's out of
      # the 10 GB cache limit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.skip != 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! needs the frontendDist folder to exist; the tests don't need the UI in it.
      - run: mkdir -p ui/dist
        if: steps.scope.outputs.skip != 'true'
        shell: bash
      # Keep going after a failing test binary, so one run shows every platform failure.
      - run: cargo test --workspace --locked --no-fail-fast
        if: steps.scope.outputs.skip != 'true'
