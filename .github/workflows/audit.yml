name: Security audit

# Known vulnerabilities in dependencies. It runs when the lockfiles change and every Monday,
# because advisories are published against dependencies that haven't changed.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  pnpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same version as devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      # Production dependencies only: dev tools (test runners, linters) don't ship. High and
      # critical fail the job; ignore one that doesn't apply under auditConfig.ignoreGhsas in
      # pnpm-workspace.yaml, with a comment saying why.
      - run: pnpm audit --prod --audit-level high

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt binary; `cargo install cargo-audit` compiles for minutes.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      # From the repo root, where .cargo/audit.toml is: cargo-audit reads it relative to the
      # working directory. The ignored warnings are listed there.
      - name: cargo audit
        run: cargo audit --deny warnings
